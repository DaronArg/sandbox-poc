<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Assessment POC</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }
    select, button { font-size: 1rem; margin: .25rem 0; }
    pre { background: #eee; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Iniciar examen</h1>
  <label>Alumno: <select id="student"></select></label><br>
  <label>Examen: <select id="exam"></select></label><br>
  <button id="start">Iniciar</button>
  <p><a href="/professor.html">Vista del profesor</a></p>
  <div id="result" hidden>
    <p>Sesión <b id="sid"></b>. Copiá y ejecutá este comando (en WSL):</p>
    <pre id="cmd"></pre>
    <p>Luego abrí <a href="http://localhost:8080" target="_blank">http://localhost:8080</a></p>
  </div>
  <script>
    async function fill(id, url, label) {
      const items = await (await fetch(url)).json();
      document.getElementById(id).innerHTML = items.map(i => `<option value="${i.id}">${label(i)}</option>`).join('');
    }
    fill('student', '/api/students', s => s.name);
    fill('exam', '/api/exams', e => e.title);
    document.getElementById('start').onclick = async () => {
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          studentId: +document.getElementById('student').value,
          examId: +document.getElementById('exam').value
        })
      });
      const s = await res.json();
      document.getElementById('sid').textContent = s.sessionId;
      document.getElementById('cmd').textContent = s.dockerRun;
      document.getElementById('result').hidden = false;
    };
  </script>
</body>
</html>
